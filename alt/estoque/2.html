<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Estoque (frontend simples)</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-6xl mx-auto p-4 space-y-4">
    <div class="flex items-center justify-between gap-4">
      <h1 class="text-xl font-bold">📦 Estoque</h1>
    </div>

    <div class="space-y-1">
      <label class="text-sm font-medium">Buscar por descrição</label>
      <input
        id="busca"
        type="text"
        placeholder="Digite para buscar..."
        class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-600"
      />
    </div>

    <hr />

    <div class="flex items-center gap-4">
      <span class="text-sm font-medium">Operador:</span>

      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="op" value="AND" checked class="accent-teal-600">
        <span>AND</span>
      </label>

      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="op" value="OR" class="accent-teal-600">
        <span>OR</span>
      </label>
    </div>

    <hr />

    <div class="space-y-2">
      <h3 class="font-semibold">Filtros</h3>

      <div id="filtros" class="space-y-2"></div>

      <div class="flex gap-2">
        <button
          id="addFiltro"
          class="rounded-lg border px-3 py-2 hover:bg-gray-100"
        >
          + Adicionar filtro
        </button>

        <button
          id="limpar"
          class="rounded-lg border px-3 py-2 text-red-600 hover:bg-red-50"
        >
          Limpar filtros
        </button>
      </div>
    </div>

    <hr />

    <div id="status" class="text-sm"></div>
    <div id="info" class="text-sm text-gray-600"></div>

    <div class="overflow-x-auto rounded-xl border bg-white">
      <table class="min-w-full text-sm">
        <thead class="bg-gray-50 text-left">
          <tr>
            <th class="px-3 py-2">Imagem</th>
            <th class="px-3 py-2">Cód</th>
            <th class="px-3 py-2">Descrição</th>
            <th class="px-3 py-2">Categoria</th>
            <th class="px-3 py-2">Qtde</th>
            <th class="px-3 py-2">Preço</th>
            <th class="px-3 py-2">Ativo</th>
          </tr>
        </thead>
        <tbody id="tbody" class="divide-y"></tbody>
      </table>
    </div>

  </div>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, getDocsFromCache, persistentLocalCache, initializeFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyBjvTgvMxOiUcJzud6Vapa5X8ZnGeph0aA",
      authDomain: "papelaria-79dc5.firebaseapp.com",
      projectId: "papelaria-79dc5",
      storageBucket: "papelaria-79dc5.firebasestorage.app",
      messagingSenderId: "730323947354",
      appId: "1:730323947354:web:6a61e2312a6cc4e361ad63"
    };
  
    const app = initializeApp(firebaseConfig);

    const db = initializeFirestore(app, {
      localCache: persistentLocalCache()
    });

    let produtos = [];
    
    function setStatusCarregando() {
      const el = document.getElementById("status");
      el.style.color = "#555";
      el.innerText = "⏳ Carregando produtos...";
    }
    
    function setStatusErro(msg) {
      const el = document.getElementById("status");
      el.style.color = "#b00020";
      el.innerText = "❌ Erro ao carregar produtos: " + msg;
    }
    
    function setStatusOk(qtde) {
      const el = document.getElementById("status");
      el.style.color = "#0a7";
      el.innerText = `✅ ${qtde} produto(s) carregado(s)`;
    }

    function setStatusAtualizando() {
      const el = document.getElementById("status");
      el.className = "text-sm text-amber-600";
      el.innerText = "🔄 Sincronizando com servidor...";
    }

    function mapearProdutos(snap) {
      return snap.docs.map(d => {
        const p = d.data();
        return {
          cod: p.cod ?? "",
          descricao: p.descricao ?? "",
          categoria: p.categoria ?? "",
          qtde: Number(p.qtde ?? 0),
          precoVenda: Number(p.precoVenda ?? 0),
          ativo: Boolean(p.ativo),
          imagem: p.imagem ?? ""
        };
      });
    }

    async function carregarProdutosFirestore() {
      try {
        setStatusCarregando();

        const colRef = collection(db, "produtos");

        let carregouCache = false;

        // 1️⃣ CACHE
        try {
          const snapCache = await getDocsFromCache(colRef);

          if (!snapCache.empty) {
            console.log("💾 Produtos carregados do CACHE");
            produtos = mapearProdutos(snapCache);
            atualizar();
            carregouCache = true;
          }
        } catch {}

        // 2️⃣ REDE
        if (carregouCache) {
          setStatusAtualizando();
        }

        const snapRede = await getDocs(colRef);
        console.log("🌐 Produtos sincronizados da REDE");

        produtos = mapearProdutos(snapRede);
        atualizar();

        setStatusOk(produtos.length);

      } catch (err) {
        console.error(err);
        setStatusErro(err.message || "Erro desconhecido");
      }
    }
    
    // ====== estado ======
    let termoBusca = "";
    let operadorGlobal = "AND"; // AND | OR

    // ====== helpers ======
    function normalizar(str) {
      return String(str ?? "")
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function parseValor(campo, valorStr) {
      const v = String(valorStr ?? "").trim();

      if (campo === "qtde" || campo === "precoVenda") return Number(v);
      if (campo === "ativo") {
        const n = normalizar(v);
        return (n === "sim" || n === "true" || n === "1");
      }
      return v;
    }

    function aplicaCondicao(prod, campo, operador, valor) {
      const valProd = prod[campo];

      if (campo === "descricao" || campo === "categoria") {
        const a = normalizar(valProd);
        const b = normalizar(valor);

        if (operador === "contains") return a.includes(b);
        if (operador === "==") return a === b;
        return false;
      }

      if (campo === "qtde" || campo === "precoVenda") {
        const a = Number(valProd);
        const b = Number(valor);
        if (Number.isNaN(b)) return false;

        if (operador === "==") return a === b;
        if (operador === ">")  return a > b;
        if (operador === "<")  return a < b;
        return false;
      }

      if (campo === "ativo") {
        const a = Boolean(valProd);
        const b = Boolean(valor);
        if (operador === "==") return a === b;
        return false;
      }

      return false;
    }

    function obterFiltrosDaTela() {
      const rows = [...document.querySelectorAll(".filtro-row")];

      const filtros = rows.map(r => {
        const campo = r.querySelector(".campo").value;
        const operador = r.querySelector(".operador").value;
        const valorRaw = r.querySelector(".valor").value;

        return { campo, operador, valor: parseValor(campo, valorRaw), valorRaw };
      });

      // remove vazios
      return filtros.filter(f => {
        if (!String(f.valorRaw).trim()) return false;
        if ((f.campo === "qtde" || f.campo === "precoVenda") && !Number.isFinite(f.valor)) return false;
        return true;
      });
    }

    function filtrar() {
      const t = normalizar(termoBusca);
      const filtros = obterFiltrosDaTela();

      return produtos.filter(p => {
        // busca simples por descrição
        const passaTexto = !t || normalizar(p.descricao).includes(t);

        if (!filtros.length) return passaTexto;

        const resultados = filtros.map(f =>
          aplicaCondicao(p, f.campo, f.operador, f.valor)
        );

        const passaFiltros =
          operadorGlobal === "AND"
            ? resultados.every(Boolean)
            : resultados.some(Boolean);

        return passaTexto && passaFiltros;
      });
    }

    function renderTabela(lista) {
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = "";

      const fragment = document.createDocumentFragment();

      for (const p of lista) {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-gray-50";

        const imagemHTML = p.imagem
          ? `<img 
                src="${p.imagem}" 
                loading="lazy"
                class="w-12 h-12 object-cover rounded-md"
            >`
          : `<span class="text-gray-400 text-xs">Sem imagem</span>`;

        tr.innerHTML = `
          <td class="px-3 py-2">${imagemHTML}</td>
          <td class="px-3 py-2">${p.cod}</td>
          <td class="px-3 py-2">${p.descricao}</td>
          <td class="px-3 py-2">${p.categoria}</td>
          <td class="px-3 py-2">${p.qtde}</td>
          <td class="px-3 py-2">R$ ${Number(p.precoVenda).toFixed(2)}</td>
          <td class="px-3 py-2">${p.ativo ? "Sim" : "Não"}</td>
        `;

        fragment.appendChild(tr);
      }

      tbody.appendChild(fragment);

      document.getElementById("info").innerText =
        `Mostrando ${lista.length} produto(s).`;
    }

    function atualizar() {
      renderTabela(filtrar());
    }

    function debounce(fn, delay = 300) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }

    // ====== UI de filtro ======
    function criarRowFiltro() {
      const div = document.createElement("div");
      div.className = "filtro-row flex gap-2 items-center bg-white p-2 rounded-lg border";
      div.innerHTML = `
        <select class="campo rounded-lg border px-2 py-1">
          <option value="categoria">Categoria</option>
          <option value="qtde">Estoque</option>
          <option value="precoVenda">Preço</option>
          <option value="ativo">Ativo</option>
          <option value="descricao">Descrição</option>
        </select>

        <select class="operador rounded-lg border px-2 py-1"></select>

        <input class="valor rounded-lg border px-2 py-1 w-32" placeholder="Valor" />

        <button type="button" class="remover text-red-600 hover:text-red-800">X</button>
      `;

      const selCampo = div.querySelector(".campo");
      const selOp = div.querySelector(".operador");

      function popularOperadores() {
        const c = selCampo.value;
        selOp.innerHTML = "";

        if (c === "categoria" || c === "descricao") {
          selOp.innerHTML = `
            <option value="contains">contém</option>
            <option value="==">igual</option>
          `;
        } else if (c === "ativo") {
          selOp.innerHTML = `<option value="==">igual</option>`;
          div.querySelector(".valor").placeholder = 'Digite: "sim" ou "nao"';
        } else {
          selOp.innerHTML = `
            <option value="==">=</option>
            <option value=">">></option>
            <option value="<"><</option>
          `;
          div.querySelector(".valor").placeholder = "Número";
        }
      }

      popularOperadores();
      selCampo.addEventListener("change", () => {
        popularOperadores();
        atualizar();
      });

      div.querySelector(".operador").addEventListener("change", atualizar);
      div.querySelector(".valor").addEventListener("input", atualizar);

      div.querySelector(".remover").onclick = () => {
        div.remove();
        atualizar();
      };

      return div;
    }

    // ====== eventos ======
    document.getElementById("busca")
      .addEventListener("input", debounce((e) => {
        termoBusca = e.target.value;
        atualizar();
      }, 250));

    document.querySelectorAll('input[name="op"]').forEach(r => {
      r.addEventListener("change", () => {
        operadorGlobal = document.querySelector('input[name="op"]:checked').value;
        atualizar();
      });
    });

    document.getElementById("addFiltro").onclick = () => {
      document.getElementById("filtros").appendChild(criarRowFiltro());
      atualizar();
    };

    document.getElementById("limpar").onclick = () => {
      document.getElementById("filtros").innerHTML = "";
      atualizar();
    };

    // ====== start ======
    document.getElementById("filtros").appendChild(criarRowFiltro());
    carregarProdutosFirestore();
  </script>
</body>
</html>
